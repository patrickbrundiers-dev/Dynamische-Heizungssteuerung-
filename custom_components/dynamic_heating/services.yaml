estimate_savings:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: dynamic_heating
    comfort_temperature:
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    eco_temperature:
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    shift_minutes:
      default: 0
      selector:
        number:
          min: -240
          max: 240
          step: 15
          unit_of_measurement: min
heat_load:
  fields:
    outdoor_temperature:
      default: -10
      selector:
        number:
          min: -30
          max: 15
          step: 1
          unit_of_measurement: "°C"
