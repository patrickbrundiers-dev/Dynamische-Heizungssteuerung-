name: HACS and Home Assistant validation

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate HACS integration
        uses: hacs/action@main
        with:
          category: integration
          # This repository is intended for manual custom-repository installation.
          # The topics check is only a repository-metadata/discoverability check;
          # it is not required for users to add this repository manually in HACS.
          ignore: topics

  hassfest:
    name: Home Assistant integration validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master
