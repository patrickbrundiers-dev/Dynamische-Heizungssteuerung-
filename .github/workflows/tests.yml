name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: dynamic-heating-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  home-assistant-tests:
    name: Home Assistant sandbox tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test tools and Home Assistant test harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt

      - name: Check code style
        run: ruff check .

      - name: Run tests inside isolated Home Assistant
        run: |
          mkdir -p test-results
          pytest -q --junitxml=test-results/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-assistant-test-results
          path: test-results/junit.xml
          if-no-files-found: ignore
