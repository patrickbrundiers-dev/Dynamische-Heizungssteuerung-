name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays: also against the newest Home Assistant, beta included.
    - cron: "41 4 * * 1"

concurrency:
  group: dynamic-heating-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  home-assistant-tests:
    name: Home Assistant sandbox tests (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The beta run only on the weekly schedule and on manual start, so a
        # broken beta never blocks a pull request.
        channel: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["stable","beta"]' || '["stable"]') }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test tools and Home Assistant test harness
        id: harness
        run: |
          python -m pip install --upgrade pip
          harness="$(python scripts/ha_test_versions.py harness ${{ matrix.channel }})"
          python -m pip install -r requirements_test.txt "$harness"
          python -m pip install $(python scripts/ha_test_versions.py requirements conversation)
          version="$(python -c 'from homeassistant.const import __version__; print(__version__)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Home Assistant $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Check code style
        run: ruff check .

      - name: Run tests inside isolated Home Assistant
        run: |
          mkdir -p test-results
          pytest -q --junitxml=test-results/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-assistant-test-results-${{ matrix.channel }}
          path: test-results/junit.xml
          if-no-files-found: ignore

      - name: Open an issue when the weekly run fails
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        env:
          HA_VERSION: ${{ steps.harness.outputs.version }}
          CHANNEL: ${{ matrix.channel }}
        with:
          script: |
            const version = process.env.HA_VERSION || "unbekannt";
            const title = `Tests schlagen mit Home Assistant ${version} fehl`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open",
            });
            if (open.data.some((issue) => issue.title === title)) return;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Der wöchentliche Testlauf (${process.env.CHANNEL}) gegen Home Assistant ${version} ist fehlgeschlagen: ${run}\n\nVor dem Home-Assistant-Update erst die Integration anpassen.`,
            });
