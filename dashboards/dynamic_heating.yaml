title: Dynamische Heizungssteuerung
views:
  - title: Übersicht
    path: dynamic-heating
    icon: mdi:home-thermometer
    cards:
      - type: markdown
        title: Raumregelung
        content: >-
          **Zuerst beobachten, dann aktivieren.** Vergleiche die berechnete
          Solltemperatur und den aktuellen Thermostat-Sollwert, während die
          dynamische Regelung ausgeschaltet ist. Pro Raum darf nur eine
          Automation den Thermostat-Sollwert steuern.
      - type: vertical-stack
        cards:
          - type: tile
            entity: select.dynamische_heizungssteuerung_betriebsart
            name: Betriebsart
          - type: tile
            entity: select.dynamische_heizungssteuerung_betriebsart_dauer
            name: Dauer
          - type: horizontal-stack
            cards:
              - type: button
                name: Automatik
                icon: mdi:calendar-clock
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: select.select_option
                  target:
                    entity_id: select.dynamische_heizungssteuerung_betriebsart
                  data:
                    option: Automatik
              - type: button
                name: Komfort
                icon: mdi:sofa
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: select.select_option
                  target:
                    entity_id: select.dynamische_heizungssteuerung_betriebsart
                  data:
                    option: Komfort
              - type: button
                name: Eco
                icon: mdi:leaf
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: select.select_option
                  target:
                    entity_id: select.dynamische_heizungssteuerung_betriebsart
                  data:
                    option: Eco
              - type: button
                name: Boost
                icon: mdi:fire
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: select.select_option
                  target:
                    entity_id: select.dynamische_heizungssteuerung_betriebsart
                  data:
                    option: Boost
              - type: button
                name: Aus
                icon: mdi:snowflake
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: select.select_option
                  target:
                    entity_id: select.dynamische_heizungssteuerung_betriebsart
                  data:
                    option: Aus
          - type: horizontal-stack
            cards:
              - type: button
                entity: button.dynamische_heizungssteuerung_zuhause
                name: Zuhause
                icon: mdi:home
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.dynamische_heizungssteuerung_zuhause
              - type: button
                entity: button.dynamische_heizungssteuerung_aktivitat
                name: Aktivität
                icon: mdi:run
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.dynamische_heizungssteuerung_aktivitat
              - type: button
                entity: button.dynamische_heizungssteuerung_schlafen
                name: Schlafen
                icon: mdi:bed
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.dynamische_heizungssteuerung_schlafen
              - type: button
                entity: button.dynamische_heizungssteuerung_abwesend
                name: Abwesend
                icon: mdi:home-export-outline
                show_state: false
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.dynamische_heizungssteuerung_abwesend
      - type: entities
        title: Status und Heizentscheidung
        show_header_toggle: false
        entities:
          - entity: switch.dynamische_heizungssteuerung_regelung_aktiv
            name: Regelung aktiv
          - entity: binary_sensor.dynamische_heizungssteuerung_thermostat_problem
            name: Thermostat-Problem
          - entity: binary_sensor.dynamische_heizungssteuerung_heizproblem
            name: Heizproblem
          - entity: sensor.dynamische_heizungssteuerung_status
            name: Letzte Heizentscheidung und Diagnosedetails
          - entity: sensor.dynamische_heizungssteuerung_raumtemperatur
            name: Raumtemperatur
          - entity: sensor.dynamische_heizungssteuerung_berechnete_solltemperatur
            name: Berechnete Solltemperatur
          - entity: sensor.dynamische_heizungssteuerung_aktueller_thermostat_sollwert
            name: Thermostat-Sollwert (Referenz)
          - entity: sensor.dynamische_heizungssteuerung_geschatzte_vorheizzeit
            name: Geschätzte Vorheizzeit
          - entity: sensor.dynamische_heizungssteuerung_prognostizierte_raumtemperatur
            name: Prognostizierte Raumtemperatur
          - entity: sensor.dynamische_heizungssteuerung_wetterprognose
            name: Wetterprognose zum Komfortzeitpunkt
          - entity: sensor.dynamische_heizungssteuerung_sonnenkorrektur_vorheizzeit
            name: Verkürzung durch Sonne
      - type: history-graph
        title: Temperatur- und Sollwertverlauf (24 Stunden)
        hours_to_show: 24
        refresh_interval: 60
        entities:
          - entity: sensor.dynamische_heizungssteuerung_raumtemperatur
            name: Ist-Raumtemperatur
          - entity: sensor.dynamische_heizungssteuerung_berechnete_solltemperatur
            name: Berechneter Sollwert
          - entity: sensor.dynamische_heizungssteuerung_aktueller_thermostat_sollwert
            name: Aktueller Thermostat-Sollwert
          - entity: sensor.dynamische_heizungssteuerung_prognostizierte_raumtemperatur
            name: Projektion
      - type: entities
        title: "Geo-Fencing: Live-Kalibrierung"
        show_header_toggle: false
        entities:
          - entity: sensor.dynamische_heizungssteuerung_geo_fencing_status
            name: Ergebnis der Standortprüfung
          - entity: sensor.dynamische_heizungssteuerung_geo_fencing_entfernung
            name: Aktuelle Entfernung (normalisiert auf Meter)
          - entity: sensor.dynamische_heizungssteuerung_alter_der_standortdaten
            name: Alter des letzten Standortupdates
          - entity: sensor.dynamische_heizungssteuerung_empfangene_standortupdates
            name: Empfangene Standortupdates
          - entity: sensor.dynamische_heizungssteuerung_mittleres_standortupdate_intervall
            name: Durchschnittliches Update-Intervall
          - entity: sensor.dynamische_heizungssteuerung_veraltete_standortereignisse
            name: Veraltete Standortphasen
          - entity: sensor.dynamische_heizungssteuerung_ungultige_standortereignisse
            name: Ungültige Standortphasen
          - entity: sensor.dynamische_heizungssteuerung_ausserhalb_der_anfahrtsentfernung
            name: Außerhalb des Anfahrtsradius
          - entity: sensor.dynamische_heizungssteuerung_erkannte_anfahrten
            name: Erkannte Anfahrten
          - entity: sensor.dynamische_heizungssteuerung_bestatigte_anfahrten
            name: Bestätigte Anfahrten
      - type: history-graph
        title: Standortaktualität und Update-Intervall (7 Tage)
        hours_to_show: 168
        refresh_interval: 300
        entities:
          - entity: sensor.dynamische_heizungssteuerung_alter_der_standortdaten
            name: Alter des aktuellen Werts (s)
          - entity: sensor.dynamische_heizungssteuerung_mittleres_standortupdate_intervall
            name: Durchschnittliches Update-Intervall (s)
      - type: markdown
        title: Geo-Fencing richtig einstellen
        content: >-
          Prüfe zuerst, wie oft dein Handy tatsächlich Standortupdates liefert.
          Das durchschnittliche Update-Intervall sollte deutlich unter dem
          eingestellten maximalen Datenalter liegen. Wenn der Status veraltete
          Daten oder eine fehlende Richtung meldet, löst Geo-Fencing keine
          neue Anfahrt aus. Der Entfernungs- und Richtungssensor müssen zur
          selben Proximity-Zone gehören.

  - title: Raummodell
    path: learning-model
    icon: mdi:home-analytics
    cards:
      - type: markdown
        title: Raummodell verstehen
        content: >-
          Das Raummodell lernt aus jeder Stunde, wie stark die Heizkörper den
          Raum erwärmen, wie viel Wärme nach außen verloren geht und was Sonne
          und Wind ausmachen. Daraus kommen Vorheizzeit, Absenkungsgrenze und
          die erreichbare Temperatur. Der Status nennt, wie viele Stunden es
          gelernt hat und wie genau es liegt.
      - type: entities
        title: Was der Raum gelernt hat
        show_header_toggle: false
        entities:
          - entity: sensor.dynamische_heizungssteuerung_raummodell
            name: Raummodell
          - entity: sensor.dynamische_heizungssteuerung_erreichbare_temperatur
            name: Heute erreichbar
          - entity: sensor.dynamische_heizungssteuerung_aufheizrate
            name: Aufheizen gerade (°C/h)
          - entity: sensor.dynamische_heizungssteuerung_abkuhlrate
            name: Abkühlen gerade (°C/h)
          - entity: sensor.dynamische_heizungssteuerung_heizleistung
            name: Heizleistung
          - entity: sensor.dynamische_heizungssteuerung_warmeverlust_je_10_degc_unterschied
            name: Wärmeverlust je 10 °C Unterschied
          - entity: sensor.dynamische_heizungssteuerung_sonnengewinn_je_kw_m2
            name: Sonnengewinn je kW/m²
          - entity: sensor.dynamische_heizungssteuerung_gelerntes_uberschwingen
            name: Gelerntes Überschwingen
      - type: history-graph
        title: Raum, Ziel und Erreichbares (7 Tage)
        hours_to_show: 168
        refresh_interval: 300
        entities:
          - entity: sensor.dynamische_heizungssteuerung_raumtemperatur
            name: Raum
          - entity: sensor.dynamische_heizungssteuerung_berechnete_solltemperatur
            name: Ziel
          - entity: sensor.dynamische_heizungssteuerung_erreichbare_temperatur
            name: Erreichbar
      - type: statistics-graph
        title: Heizleistung und Wärmeverlust (30 Tage)
        chart_type: line
        period: day
        days_to_show: 30
        stat_types:
          - mean
        entities:
          - entity: sensor.dynamische_heizungssteuerung_heizleistung
            name: Heizleistung (°C/h)
          - entity: sensor.dynamische_heizungssteuerung_warmeverlust_je_10_degc_unterschied
            name: Wärmeverlust (°C/h)
